<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 24" width="1200" height="24">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff5a4e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#ff5a4e" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ff5a4e" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="spark" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe9e0"/><stop offset="0.4" stop-color="#ffb199" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ff5a4e" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <style>
    .spark { animation: sweep 5s cubic-bezier(.45,0,.55,1) infinite; }
    @keyframes sweep { 0% { transform: translateX(200px); opacity: 0 } 15%,85% { opacity: 1 } 100% { transform: translateX(1000px); opacity: 0 } }
  </style>
  <rect x="0" y="11.5" width="1200" height="1" fill="url(#line)"/>
  <ellipse class="spark" cx="0" cy="12.0" rx="60" ry="3" fill="url(#spark)"/>
  <circle cx="600.0" cy="12.0" r="3" fill="#ff5a4e" opacity="0.8"/>
</svg>
